services:
  postgres:
    image: postgres:16-alpine
    container_name: dinner-party-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dinner_party_planner
      POSTGRES_USER: dinner_user
      POSTGRES_PASSWORD: dinner_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dinner_user -d dinner_party_planner"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
